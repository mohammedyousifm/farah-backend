      responses:
        '200': { description: Paginated Settlement }
  /provider/finance/settlements/{id}:
    get:
      tags: [Provider]
      summary: Settlement with entries
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Settlement, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Settlement' } } } } } }
